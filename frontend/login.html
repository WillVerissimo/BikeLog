<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeLog - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-card">
        <h1>BikeLog</h1>
        <p>Entre para acessar seus pedais</p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>
        </form>

        <p id="mensagem"></p>
    </main>

    <script src="login.js"></script>
</body>
</html>
