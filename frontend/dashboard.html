<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeLog - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <main class="dashboard">

        <header class="dashboard-header">
            <div>
                <h1>🚴 BikeLog</h1>
                <p>Seu espaço para gerenciar bicicletas e pedaladas.</p>
            </div>

            <button id="btnLogout" type="button">
                Sair
            </button>
        </header>

        <section class="welcome">
            <h2 id="boasVindas">Bem-vindo!</h2>
            <p>Gerencie suas bicicletas em um só lugar.</p>
        </section>

        <section class="dashboard-section">
            <h2>Minhas bicicletas</h2>

            <div id="listaBicicletas">
                <p>Carregando bicicletas...</p>
            </div>
        </section>

        <section class="dashboard-section">
            <h2>Cadastrar nova bicicleta</h2>

            <form id="formBicicleta">

                <input
                    type="text"
                    id="nomeBicicleta"
                    placeholder="Nome da bicicleta"
                    required
                >

                <input
                    type="text"
                    id="marca"
                    placeholder="Marca"
                >

                <input
                    type="text"
                    id="modelo"
                    placeholder="Modelo"
                >

                <label for="tipo">Tipo da bicicleta</label>
                <select id="tipo" aria-label="Tipo da bicicleta">
                    <option value="">Selecione o tipo</option>
                    <option value="Speed">Speed</option>
                    <option value="MTB">Mountain Bike</option>
                    <option value="Gravel">Gravel</option>
                    <option value="Urbana">Urbana</option>
                    <option value="Outra">Outra</option>
                </select>

                <button type="submit" id="btnCadastrar">
                    Cadastrar bicicleta
                </button>
                <button type="button" id="btnCancelarEdicao" hidden>Cancelar edição</button>
            </form>

            <p id="mensagemBicicleta" role="status"></p>
        </section>

        <section class="dashboard-section">
            <h2>Minhas pedaladas</h2>
            <div id="estatisticasPedais" class="estatisticas"></div>
            <div id="listaPedaladas"><p>Carregando pedaladas...</p></div>
        </section>
        <section class="dashboard-section">
            <h2>Registrar pedalada</h2>
            <form id="formPedalada">
                <label for="pedalBicicleta">Bicicleta</label>
                <select id="pedalBicicleta" required></select>
                <label for="pedalData">Data</label>
                <input id="pedalData" type="date" required>
                <label for="pedalDistancia">Distância (km)</label>
                <input id="pedalDistancia" type="number" min="0.01" step="0.01" required>
                <label for="pedalDuracao">Duração (minutos)</label>
                <input id="pedalDuracao" type="number" min="1" step="1" required>
                <label for="pedalObservacoes">Observações</label>
                <input id="pedalObservacoes" type="text" maxlength="1000">
                <button id="salvarPedalada" type="submit">Registrar pedalada</button>
                <button id="cancelarPedalada" type="button" hidden>Cancelar edição</button>
            </form>
            <p id="mensagemPedalada" role="status"></p>
        </section>
    </main>

    <script src="dashboard.js"></script>
    <script src="pedaladas.js"></script>

</body>
</html>
